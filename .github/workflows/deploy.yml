# Web cũ (GitHub Pages) đã ngừng (Issue #52) – web chính chạy trên Cloudflare Pages (thư mục v2/).
# Workflow này chỉ đăng 1 trang CHUYỂN HƯỚNG lên GitHub Pages, để các link cũ
# (…github.io/tuchanbaodien/review.html?id=…) tự sang đúng trang trên tuchanbaodien.com.
name: Chuyển hướng GitHub Pages sang web mới

on:
  push:
    branches: [main]
    paths: ['.github/chuyen-huong/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Tạo các trang chuyển hướng (đủ tên file của web cũ)
        run: |
          mkdir -p _site
          for f in index review nhan-vat danh-sach the-luc tu-luyen tim-kiem de-cu thuat-ngu kiem-tra 404; do
            cp .github/chuyen-huong/index.html "_site/$f.html"
          done
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
