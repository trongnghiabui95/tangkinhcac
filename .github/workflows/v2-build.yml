# Build thử bản v2 (Astro) trên mọi PR có sửa thư mục v2/: ảnh → HTML → chỉ mục tìm kiếm.
name: v2-build
on:
  pull_request:
    paths: ['v2/**', '.github/workflows/v2-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - name: Kiểm thử bộ kiểm tra nội dung (3 file sai phải bị chặn)
        run: npm run test:noi-dung
      - name: Build (kiểm tra nội dung → ảnh → Astro → Pagefind)
        run: npm run build
      - name: Thêm 1 bài .mdx hợp lệ → phải có trang mới, hiện ở trang chủ, bộ truyện, danh mục, menu, sitemap
        run: bash tests/thu-them-bai.sh
