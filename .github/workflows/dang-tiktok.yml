# Đăng clip TikTok qua Zernio SAU KHI chủ dự án duyệt (Issue #107).
#  - Chạy khi có comment mới trên Issue nhãn `marketing`, người comment là chủ repo VÀ comment bắt đầu bằng "Duyệt".
#  - Đọc khối <!-- tiktok clip: … caption_file: … dang_luc: … --> trong thân Issue; clip + caption nằm trên nhánh marketing/clips.
#  - Thành công: comment giờ đăng + link, gắn nhãn da-dang, đóng Issue. Lỗi: comment lỗi, gắn nhãn bi-chan.
#  - Chạy tay (Actions → dang-tiktok → Run workflow) = "Thử kết nối Zernio": chỉ liệt kê tài khoản đã kết nối, không đăng gì.
#  - Khoá API nằm trong secret ZERNIO_API_KEY, không in ra log.
name: dang-tiktok
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: dang-tiktok-${{ github.event.issue.number || 'thu' }}
  cancel-in-progress: false
jobs:
  thu-ket-noi:
    name: Thử kết nối Zernio
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Liệt kê tài khoản đã kết nối (không đăng gì)
        working-directory: v2
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          KET_QUA: ket-qua.md
        run: |
          set +e
          node scripts/dang-tiktok.mjs --thu-ket-noi; ma=$?
          cat ket-qua.md >> "$GITHUB_STEP_SUMMARY"
          exit $ma

  dang:
    name: Đăng TikTok
    # Lọc sơ ở đây (đỡ tốn lượt chạy); script kiểm lại chữ "Duyệt" không phân biệt hoa thường.
    if: >-
      github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      github.event.comment.user.login == 'trongnghiabui95' &&
      contains(github.event.issue.labels.*.name, 'marketing') &&
      !contains(github.event.issue.labels.*.name, 'da-dang')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SO_ISSUE: ${{ github.event.issue.number }}
      COMMENT: ${{ github.event.comment.body }}
    steps:
      - name: Comment có phải "Duyệt" không
        id: duyet
        run: |
          dau=$(printf '%s' "$COMMENT" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(s.normalize("NFC").trimStart().slice(0,5).toLocaleLowerCase("vi")))')
          if [ "$dau" = "duyệt" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "Comment không bắt đầu bằng 'Duyệt' → bỏ qua."; fi
      - uses: actions/checkout@v4
        if: steps.duyet.outputs.ok == '1'
      - name: Lấy clip từ nhánh marketing/clips
        if: steps.duyet.outputs.ok == '1'
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: marketing/clips
          path: v2/nhanh-clip
          lfs: true
      - name: Tải clip lên Zernio và tạo bài TikTok
        id: dang
        if: steps.duyet.outputs.ok == '1'
        working-directory: v2
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_TIKTOK_ID: ${{ vars.ZERNIO_TIKTOK_ID }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          KET_QUA: ket-qua.md
        run: |
          set +e
          node scripts/dang-tiktok.mjs --dang --thu-muc nhanh-clip; ma=$?
          cat ket-qua.md >> "$GITHUB_STEP_SUMMARY"
          exit $ma
      - name: Báo kết quả vào Issue
        if: always() && steps.duyet.outputs.ok == '1'
        working-directory: v2
        env:
          KET_QUA_DANG: ${{ steps.dang.outcome }}
          LINK_CHAY: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -s ket-qua.md ] || echo "❌ **Chưa đăng được TikTok.** Bước chuẩn bị bị lỗi." > ket-qua.md
          printf '\n\n[Xem lần chạy](%s)\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' "$LINK_CHAY" >> ket-qua.md
          gh issue comment "$SO_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file ket-qua.md
          if [ "$KET_QUA_DANG" = "success" ]; then
            gh label create da-dang --repo "$GITHUB_REPOSITORY" --color 0E8A16 --description "Đã đăng lên mạng xã hội" 2>/dev/null || true
            gh issue edit "$SO_ISSUE" --repo "$GITHUB_REPOSITORY" --add-label da-dang --remove-label bi-chan 2>/dev/null \
              || gh issue edit "$SO_ISSUE" --repo "$GITHUB_REPOSITORY" --add-label da-dang
            gh issue close "$SO_ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed
          else
            gh issue edit "$SO_ISSUE" --repo "$GITHUB_REPOSITORY" --add-label bi-chan
            exit 1
          fi
