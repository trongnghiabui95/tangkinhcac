# Chạy trên mọi Pull Request: kiểm tra cú pháp JS, đọc dữ liệu mẫu, mở thử các trang.
# Đỏ = có lỗi, KHÔNG merge. Xem chi tiết ở tab "Checks" của PR.
name: kiem-tra

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 1. Cú pháp JavaScript (node --check)
        run: |
          set -e
          for f in $(git ls-files '*.js' '*.mjs'); do
            node --check "$f" && echo "OK   $f"
          done

      - name: 2. Đọc dữ liệu mẫu data/mau/*.csv
        run: python3 tools/kiem-tra/doc_csv.py

      - name: Cài trình duyệt không giao diện (Playwright)
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: 3. Mở thử các trang, bắt lỗi console (e2e)
        run: node tools/kiem-tra/e2e.mjs
